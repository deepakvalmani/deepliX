<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" fill="none">
  <style>
    .wordmark { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -1.5px; }
    .dark { fill: #0d1b26; }
    .accent { fill: #0b6e69; }
  </style>
  <!-- Hexagonal network icon -->
  <g transform="translate(4, 2)">
    <!-- Outer hexagon -->
    <polygon points="30,0 55.98,15 55.98,45 30,60 4.02,45 4.02,15" stroke="#0b6e69" stroke-width="2" fill="none"/>
    <!-- Inner lines connecting center to vertices -->
    <line x1="30" y1="30" x2="30" y2="0" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="55.98" y2="15" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="55.98" y2="45" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="30" y2="60" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="4.02" y2="45" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="4.02" y2="15" stroke="#0b6e69" stroke-width="1.5" opacity="0.6"/>
    <!-- Cross lines between alternating vertices -->
    <line x1="30" y1="0" x2="55.98" y2="45" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <line x1="55.98" y1="15" x2="4.02" y2="45" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <line x1="55.98" y1="45" x2="4.02" y2="15" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="60" x2="4.02" y2="15" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <line x1="4.02" y1="45" x2="30" y2="0" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <line x1="4.02" y1="15" x2="55.98" y2="45" stroke="#0b6e69" stroke-width="1" opacity="0.3"/>
    <!-- Vertex nodes -->
    <circle cx="30" cy="0" r="3.5" fill="#0b6e69"/>
    <circle cx="55.98" cy="15" r="3.5" fill="#0b6e69"/>
    <circle cx="55.98" cy="45" r="3.5" fill="#0b6e69"/>
    <circle cx="30" cy="60" r="3.5" fill="#0b6e69"/>
    <circle cx="4.02" cy="45" r="3.5" fill="#0b6e69"/>
    <circle cx="4.02" cy="15" r="3.5" fill="#0b6e69"/>
    <!-- Center node -->
    <circle cx="30" cy="30" r="4.5" fill="#0b6e69"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="46" class="wordmark">
    <tspan class="dark">deep</tspan><tspan class="accent">li</tspan><tspan class="dark">X</tspan>
  </text>
</svg>
